name: Live site monitor

on:
  schedule:
    - cron: '17 8 * * *'
      timezone: Europe/Zurich
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: live-site-monitor
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: monitoring
    env:
      CB_MONITOR_TARGETS: ${{ vars.CB_MONITOR_TARGETS }}
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/setup-node@v6
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: monitoring/package-lock.json
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - name: Check public pages with one confirmation retry
        run: npm test
      - name: Keep report and failure captures
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v5
        with:
          name: live-site-report
          path: |
            monitoring/playwright-report/
            monitoring/test-results/
            monitoring/results.json
          retention-days: 14

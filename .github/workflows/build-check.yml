name: Verify minified assets

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  distribution:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/setup-node@v6
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: build/package-lock.json
      - run: npm ci --prefix build --ignore-scripts --no-audit --no-fund
      - name: Check committed distribution against readable sources
        run: npm run check --prefix build
      - name: Exercise source and minified public runtimes
        run: npm test --prefix build
